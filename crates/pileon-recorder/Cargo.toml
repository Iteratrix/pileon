[package]
name = "pileon-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
az = "1.3.0"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
fs4 = "1.1.0"
futures-util = "0.3.34"
jiff = "0.2.38"
log = "0.4.34"
pileon-core = { version = "0.1.0", path = "../pileon-core" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "signal", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
zstd = "0.14.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
